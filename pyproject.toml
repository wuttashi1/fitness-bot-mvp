[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-telegram-bot"
version = "0.2.0"
description = "Russian-language workout tracker with an Excel-derived starter program"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.27,<4", "python-dotenv>=1.0,<2", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "openpyxl>=3.1,<4"]

[project.scripts]
fitness-bot = "fitness_bot.__main__:main"

[tool.setuptools.package-data]
fitness_bot = ["schema.sql", "data/*.json", "data/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

